name: Latest blog posts
on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:
  push:  # temporary — remove after confirming it works
    branches: [main]
    
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://muizzyranking.me/blog/rss.xml"
          max_post_count: 5
          readme_path: README.md
